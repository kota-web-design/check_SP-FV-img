<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Service Icon Preview v2</title>
  <desc id="desc">A cleaner six-icon preview with more space and less overlap.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0e2d5c" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f7fbff; }
      .title { fill: #06265f; font-family: "Noto Serif JP", "Yu Mincho", serif; font-size: 36px; font-weight: 700; letter-spacing: 0; text-anchor: middle; }
      .card { fill: #fff; stroke: #b8dcff; stroke-width: 1.5; filter: url(#cardShadow); }
      .icon-bg { fill: #e6f3ff; }
      .icon { fill: none; stroke: #06265f; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #06265f; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .sub { fill: #0965bb; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="72">サービスアイコン案 v2</text>

  <!-- Brokerage: simple house with a separated key -->
  <g transform="translate(90 125)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(108 43)">
      <path d="M12 37 42 13l30 24"/>
      <path d="M22 34v38h40V34"/>
      <path d="M38 72V53h13v19"/>
      <circle cx="71" cy="62" r="8"/>
      <path d="M77 68 88 79"/>
      <path d="M84 75h8"/>
    </g>
    <text class="label" x="150" y="178">不動産売買・賃貸の仲介</text>
    <text class="sub" x="150" y="209">住まい探しと契約をサポート</text>
  </g>

  <!-- Property management: building and a separated gear -->
  <g transform="translate(450 125)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(111 42)">
      <path d="M17 77V14h35v63"/>
      <path d="M9 77h51"/>
      <path d="M28 27h4"/>
      <path d="M40 27h4"/>
      <path d="M28 41h4"/>
      <path d="M40 41h4"/>
      <path d="M28 55h4"/>
      <path d="M40 55h4"/>
      <circle cx="68" cy="61" r="13"/>
      <path d="M68 43v6"/>
      <path d="M68 73v6"/>
      <path d="M50 61h6"/>
      <path d="M80 61h6"/>
      <path d="M55 48l4 4"/>
      <path d="M77 70l4 4"/>
      <path d="M81 48l-4 4"/>
      <path d="M59 70l-4 4"/>
    </g>
    <text class="label" x="150" y="178">不動産の管理</text>
    <text class="sub" x="150" y="209">安定した運用を支援</text>
  </g>

  <!-- Consultation: single speech bubble and question mark -->
  <g transform="translate(810 125)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(107 46)">
      <path d="M14 13h50a18 18 0 0 1 0 36H42L21 65V49h-7a18 18 0 0 1 0-36Z"/>
      <path d="M42 24c0-6 5-10 12-10s12 4 12 10c0 8-9 9-9 16"/>
      <path d="M57 51h.1"/>
    </g>
    <text class="label" x="150" y="178">不動産関連のご相談</text>
    <text class="sub" x="150" y="209">疑問や不安を整理</text>
  </g>

  <!-- Purchase appraisal: magnifier and yen -->
  <g transform="translate(90 445)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(110 43)">
      <circle cx="34" cy="35" r="23"/>
      <path d="M51 52 73 74"/>
      <path d="M24 27 34 42l10-15"/>
      <path d="M34 42v18"/>
      <path d="M24 45h20"/>
      <path d="M24 53h20"/>
    </g>
    <text class="label" x="150" y="178">買取査定</text>
    <text class="sub" x="150" y="209">価格を分かりやすく査定</text>
  </g>

  <!-- Lodging business: bed and moon -->
  <g transform="translate(450 445)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(108 45)">
      <path d="M15 68V35"/>
      <path d="M15 51h52a13 13 0 0 1 13 13v4"/>
      <path d="M15 51V31h24a12 12 0 0 1 12 12v8"/>
      <path d="M15 68h65"/>
      <path d="M73 18c-8 2-14 9-14 18 0 11 9 20 20 20 2 0 4 0 6-1-4 7-11 12-20 12-13 0-24-11-24-24 0-12 9-23 21-25 4-1 7-1 11 0Z"/>
    </g>
    <text class="label" x="150" y="178">住宅宿泊事業</text>
    <text class="sub" x="150" y="209">宿泊体験をつくる</text>
  </g>

  <!-- Lodging management: checklist only -->
  <g transform="translate(810 445)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(114 42)">
      <path d="M15 13h44v69H15Z"/>
      <path d="M27 13V6h20v7"/>
      <path d="m26 33 6 6 11-13"/>
      <path d="M49 35h15"/>
      <path d="m26 55 6 6 11-13"/>
      <path d="M49 57h15"/>
    </g>
    <text class="label" x="150" y="178">住宅宿泊管理業</text>
    <text class="sub" x="150" y="209">運営管理をトータル対応</text>
  </g>
</svg>
