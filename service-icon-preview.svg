<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Service Icon Preview</title>
  <desc id="desc">Six navy line icons for real estate and lodging services.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0e2d5c" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f7fbff; }
      .title { fill: #06265f; font-family: "Noto Serif JP", "Yu Mincho", serif; font-size: 38px; font-weight: 700; letter-spacing: 0; text-anchor: middle; }
      .card { fill: #fff; stroke: #b8dcff; stroke-width: 1.5; filter: url(#cardShadow); }
      .icon-bg { fill: #e6f3ff; }
      .icon { fill: none; stroke: #06265f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #06265f; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .sub { fill: #0965bb; font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="600" y="72">サービスアイコン案</text>

  <!-- 1. Brokerage: house + key -->
  <g transform="translate(90 125)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(106 42)">
      <path d="M8 38 44 9l36 29"/>
      <path d="M18 35v42h52V35"/>
      <path d="M37 77V55h17v22"/>
      <circle cx="64" cy="61" r="10"/>
      <path d="M72 68 87 83"/>
      <path d="M82 78h8"/>
      <path d="M86 82h8"/>
    </g>
    <text class="label" x="150" y="178">不動産売買・賃貸の仲介</text>
    <text class="sub" x="150" y="209">住まい探しと契約をサポート</text>
  </g>

  <!-- 2. Property management: building + check -->
  <g transform="translate(450 125)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(105 41)">
      <path d="M19 80V12h41v68"/>
      <path d="M9 80h74"/>
      <path d="M31 25h6"/>
      <path d="M45 25h6"/>
      <path d="M31 40h6"/>
      <path d="M45 40h6"/>
      <path d="M31 55h6"/>
      <path d="M45 55h6"/>
      <path d="M63 49l18 7v12c0 11-7 19-18 23-11-4-18-12-18-23V56l18-7Z"/>
      <path d="m54 68 6 6 12-14"/>
    </g>
    <text class="label" x="150" y="178">不動産の管理</text>
    <text class="sub" x="150" y="209">安定した運用を支援</text>
  </g>

  <!-- 3. Consultation: speech + question -->
  <g transform="translate(810 125)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(105 44)">
      <path d="M12 17h48a19 19 0 0 1 0 38H39L19 70V55h-7a19 19 0 0 1 0-38Z"/>
      <path d="M56 51h14a15 15 0 0 1 0 30h-3v11L52 81H41"/>
      <path d="M39 31c0-6 5-10 12-10s12 4 12 10c0 8-9 9-9 15"/>
      <path d="M54 58h.1"/>
    </g>
    <text class="label" x="150" y="178">不動産関連のご相談</text>
    <text class="sub" x="150" y="209">疑問や不安を整理</text>
  </g>

  <!-- 4. Purchase appraisal: document + yen -->
  <g transform="translate(90 445)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(108 42)">
      <path d="M19 10h42l14 14v58H19Z"/>
      <path d="M61 10v16h14"/>
      <path d="M35 34 47 51l12-17"/>
      <path d="M47 51v19"/>
      <path d="M34 54h26"/>
      <path d="M34 63h26"/>
      <path d="M8 24v70h54"/>
    </g>
    <text class="label" x="150" y="178">買取査定</text>
    <text class="sub" x="150" y="209">価格を分かりやすく査定</text>
  </g>

  <!-- 5. Lodging business: house + bed -->
  <g transform="translate(450 445)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(104 42)">
      <path d="M8 38 46 9l38 29"/>
      <path d="M19 34v48h54V34"/>
      <path d="M29 61h34"/>
      <path d="M29 50h20a12 12 0 0 1 12 12"/>
      <path d="M29 50v22"/>
      <path d="M64 61v11"/>
      <path d="M70 15c7 5 11 12 11 21"/>
    </g>
    <text class="label" x="150" y="178">住宅宿泊事業</text>
    <text class="sub" x="150" y="209">宿泊体験をつくる</text>
  </g>

  <!-- 6. Lodging management: clipboard + house + check -->
  <g transform="translate(810 445)">
    <rect class="card" width="300" height="250" rx="18"/>
    <circle class="icon-bg" cx="150" cy="86" r="52"/>
    <g class="icon" transform="translate(111 42)">
      <path d="M17 14h46v72H17Z"/>
      <path d="M30 14V6h20v8"/>
      <path d="M27 29h20"/>
      <path d="M27 69h20"/>
      <path d="M27 56 40 45l13 11"/>
      <path d="M31 53v17h18V53"/>
      <path d="M38 70V60h5v10"/>
      <path d="m58 34 7 7 12-14"/>
    </g>
    <text class="label" x="150" y="178">住宅宿泊管理業</text>
    <text class="sub" x="150" y="209">運営管理をトータル対応</text>
  </g>
</svg>
